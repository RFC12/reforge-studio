; ReForge DualSense — ajustes (se leen al abrir el juego)
[dualsense]
; 1 = usar el DualSense directamente (USB o Bluetooth)
enabled=1
; gatillos adaptativos: L2 con resistencia de apuntado, R2 con punto de disparo y vibración al disparar
adaptive_triggers=1
; fuerza de los gatillos 0-100
trigger_intensity=100
l2_start=3
l2_strength=3
r2_start=4
r2_strength=6
r2_fire_frequency=32
rumble=1
; color de la barra de luz y LED de jugador (0-4)
lightbar_r=0
lightbar_g=80
lightbar_b=255
player_led=1
; 1 = los demás mandos XInput siguen como jugadores 2-4 (déjalo en 0 si usas Steam Input o DS4Windows)
other_controllers=0
; iconos de PlayStation: texture_swap usa reforge_textures\swap; texture_dump=1 guarda las texturas para reconocerlas
texture_swap=1
texture_dump=1
