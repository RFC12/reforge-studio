name: Build ReForge Studio
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python tests/test_xiso.py
      - run: python tests/test_patches.py
      - run: python tools/make_patch.py patches/xbox_utility -o dist/patches
      - name: App (onedir)
        run: python -m PyInstaller --noconfirm --onedir --windowed --name ReForgeStudio --icon assets\icon.ico --add-data "assets;assets" --add-data "dist\patches;bundled_patches" --collect-submodules send2trash --distpath build\app --workpath build\work main.py
      - run: python tools/make_payload.py build\app\ReForgeStudio build\installer
      - name: Instalador
        shell: pwsh
        run: |
          $ver = python -c "import reforge;print(reforge.__version__)"
          python -m PyInstaller --noconfirm --onefile --windowed --name "ReForgeStudio-Setup-$ver" --icon assets\icon.ico --paths . --hidden-import reforge.toolchain --add-data "build\installer\payload.zip;." --add-data "build\installer\payload.json;." --add-data "assets\icon.ico;." --distpath dist --workpath build\work-setup installer\setup.py
      - uses: actions/upload-artifact@v4
        with:
          name: ReForgeStudio-windows
          path: |
            dist/ReForgeStudio-Setup-*.exe
            dist/patches/*.rfpatch
